name: Deploy to Google Cloud VM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: xora-gcp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Deploy directly on production VM
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/xora_chart_ai"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the self-hosted runner." >&2
            exit 1
          fi

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            git clone https://github.com/admin-xtinex/xora_chart_ai.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git fetch --prune origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi

          chmod +x deploy/gcp/deploy.sh deploy/gcp/cleanup-old-data.sh deploy/gcp/install-cleanup-cron.sh
          ./deploy/gcp/deploy.sh
          sudo REPO_DIR="$DEPLOY_DIR" bash deploy/gcp/install-cleanup-cron.sh

      - name: Diagnose Binance WebSocket
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Backend recent WebSocket logs ==="
          docker logs --since 15m xora_chart_api 2>&1 | grep -Ei 'websocket|WS session|fstream|binance|451|403|timeout|SSL|handshake' | tail -n 120 || true

          echo "=== Direct VM Binance Futures WebSocket probe ==="
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import websockets

          async def main():
              url = "wss://fstream.binance.com/ws/!ticker@arr"
              try:
                  async with websockets.connect(url, open_timeout=12, close_timeout=3) as ws:
                      msg = await asyncio.wait_for(ws.recv(), timeout=12)
                      print("BINANCE_WS_OK", len(msg))
              except Exception as exc:
                  print("BINANCE_WS_ERROR", type(exc).__name__, repr(exc))

          asyncio.run(main())
          PY
          '

      - name: Verify local frontend
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            HOME_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1/ || true)"
            if [[ "$HOME_CODE" == "200" ]]; then
              echo "Frontend HTTP 200 on self-hosted production VM."
              exit 0
            fi
            sleep 5
          done
          echo "Local frontend verification failed. Last code: ${HOME_CODE:-<none>}" >&2
          exit 1
