name: Deploy to Google Cloud VM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: xora-gcp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Deploy directly on production VM
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/xora_chart_ai"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the self-hosted runner." >&2
            exit 1
          fi

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            git clone https://github.com/admin-xtinex/xora_chart_ai.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git config core.fileMode false
          git fetch --prune origin main
          git checkout -f main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi

          chmod +x deploy/gcp/deploy.sh deploy/gcp/cleanup-old-data.sh deploy/gcp/install-cleanup-cron.sh
          ./deploy/gcp/deploy.sh
          sudo REPO_DIR="$DEPLOY_DIR" bash deploy/gcp/install-cleanup-cron.sh

      - name: Diagnose market WebSockets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Backend recent WebSocket logs ==="
          docker logs --since 15m xora_chart_api 2>&1 | grep -Ei 'websocket|WS session|fstream|binance|451|403|timeout|SSL|handshake|ticker|kline|depth|mark|aggTrade|bookTicker' | tail -n 180 || true

          echo "=== Current VM WebSocket controls ==="
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import json
          import websockets

          PROBES = {
              "futures_ticker": "wss://fstream.binance.com/ws/btcusdt@ticker",
              "futures_mini_ticker": "wss://fstream.binance.com/ws/btcusdt@miniTicker",
              "futures_kline": "wss://fstream.binance.com/ws/btcusdt@kline_1m",
              "futures_mark": "wss://fstream.binance.com/ws/btcusdt@markPrice@1s",
              "futures_depth": "wss://fstream.binance.com/ws/btcusdt@depth20@100ms",
              "futures_agg_trade": "wss://fstream.binance.com/ws/btcusdt@aggTrade",
              "futures_book_ticker": "wss://fstream.binance.com/ws/btcusdt@bookTicker",
              "futures_all_book_ticker": "wss://fstream.binance.com/ws/!bookTicker",
              "futures_combined_alt": "wss://fstream.binance.com/stream?streams=btcusdt@aggTrade/btcusdt@bookTicker/btcusdt@depth20@100ms",
              "spot_ticker_443": "wss://stream.binance.com:443/ws/btcusdt@ticker",
              "spot_ticker_9443": "wss://stream.binance.com:9443/ws/btcusdt@ticker",
          }

          async def probe(name, url):
              try:
                  async with websockets.connect(
                      url,
                      open_timeout=10,
                      close_timeout=3,
                      ping_interval=None,
                  ) as ws:
                      raw = await asyncio.wait_for(ws.recv(), timeout=12)
                      try:
                          data = json.loads(raw)
                          event = data.get("e") if isinstance(data, dict) else None
                          stream = data.get("stream") if isinstance(data, dict) else None
                          print("WS_CONTROL_OK", name, "event=", event, "stream=", stream, "bytes=", len(raw))
                      except Exception:
                          print("WS_CONTROL_OK", name, "bytes=", len(raw))
                      return True
              except Exception as exc:
                  print("WS_CONTROL_ERROR", name, type(exc).__name__, repr(exc))
                  return False

          async def subscribe_probe():
              name = "futures_subscribe_rpc_alt"
              try:
                  async with websockets.connect(
                      "wss://fstream.binance.com/ws",
                      open_timeout=10,
                      close_timeout=3,
                      ping_interval=None,
                  ) as ws:
                      await ws.send(json.dumps({
                          "method": "SUBSCRIBE",
                          "params": [
                              "btcusdt@aggTrade",
                              "btcusdt@bookTicker",
                              "btcusdt@depth20@100ms",
                              "btcusdt@ticker",
                              "btcusdt@kline_1m",
                              "btcusdt@markPrice@1s",
                          ],
                          "id": 1,
                      }))
                      deadline = asyncio.get_running_loop().time() + 12
                      seen = set()
                      while asyncio.get_running_loop().time() < deadline and len(seen) < 3:
                          raw = await asyncio.wait_for(ws.recv(), timeout=12)
                          data = json.loads(raw)
                          if isinstance(data, dict) and data.get("id") == 1:
                              print("WS_CONTROL_ACK", name, data)
                              continue
                          event = data.get("e") if isinstance(data, dict) else None
                          seen.add(event or "bookTicker")
                          print("WS_CONTROL_OK", name, "event=", event, "bytes=", len(raw))
                      return bool(seen)
              except Exception as exc:
                  print("WS_CONTROL_ERROR", name, type(exc).__name__, repr(exc))
                  return False

          async def main():
              await asyncio.gather(*(probe(name, url) for name, url in PROBES.items()))
              await subscribe_probe()

          asyncio.run(main())
          PY
          '

      - name: Report XORA WebSocket telemetry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker exec xora_chart_api python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main():
              async with websockets.connect("ws://127.0.0.1:8030/ws", open_timeout=5) as ws:
                  await ws.recv()
                  await ws.send(json.dumps({"id": "telemetry", "action": "health", "payload": {}}))
                  msg = json.loads(await ws.recv())
                  print(json.dumps(msg.get("data") or {}, indent=2))

          asyncio.run(main())
          PY

      - name: Verify local frontend
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1/ || true)"
            HTTPS_CODE="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve xora.xtinex.com:443:127.0.0.1 https://xora.xtinex.com/ || true)"
            if [[ "$HTTPS_CODE" == "200" || "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
              echo "Frontend reachable (HTTP=${HTTP_CODE:-none}, HTTPS=${HTTPS_CODE:-none})."
              exit 0
            fi
            sleep 5
          done
          echo "Local frontend verification failed. HTTP=${HTTP_CODE:-none} HTTPS=${HTTPS_CODE:-none}" >&2
          exit 1
