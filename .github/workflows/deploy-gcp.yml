name: Deploy to Google Cloud VM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: xora-gcp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Deploy directly on production VM
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/xora_chart_ai"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the self-hosted runner." >&2
            exit 1
          fi

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            git clone https://github.com/admin-xtinex/xora_chart_ai.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git config core.fileMode false
          git fetch --prune origin main
          git checkout -f main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi

          chmod +x deploy/gcp/deploy.sh deploy/gcp/cleanup-old-data.sh deploy/gcp/install-cleanup-cron.sh
          ./deploy/gcp/deploy.sh
          sudo REPO_DIR="$DEPLOY_DIR" bash deploy/gcp/install-cleanup-cron.sh

      - name: Diagnose Binance WebSocket
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Backend recent WebSocket logs ==="
          docker logs --since 15m xora_chart_api 2>&1 | grep -Ei 'websocket|WS session|fstream|binance|451|403|timeout|SSL|handshake|ticker' | tail -n 160 || true

          echo "=== Direct VM Binance Futures WebSocket probes ==="
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import json
          import websockets

          STREAMS = {
              "all_tickers_direct": "wss://fstream.binance.com/ws/!ticker@arr",
              "btc_ticker_direct": "wss://fstream.binance.com/ws/btcusdt@ticker",
              "btc_kline_direct": "wss://fstream.binance.com/ws/btcusdt@kline_1m",
              "btc_mark_direct": "wss://fstream.binance.com/ws/btcusdt@markPrice@1s",
              "btc_ticker_combined": "wss://fstream.binance.com/stream?streams=btcusdt@ticker",
          }

          async def probe(name, url):
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=3, ping_interval=None) as ws:
                      raw = await asyncio.wait_for(ws.recv(), timeout=10)
                      data = json.loads(raw)
                      print("BINANCE_WS_OK", name, type(data).__name__, str(data)[:300])
              except Exception as exc:
                  print("BINANCE_WS_ERROR", name, type(exc).__name__, repr(exc))

          async def probe_subscribe():
              name = "btc_subscribe_rpc"
              try:
                  async with websockets.connect(
                      "wss://fstream.binance.com/ws",
                      open_timeout=10,
                      close_timeout=3,
                      ping_interval=None,
                  ) as ws:
                      await ws.send(json.dumps({
                          "method": "SUBSCRIBE",
                          "params": ["btcusdt@ticker", "btcusdt@kline_1m", "btcusdt@markPrice@1s"],
                          "id": 1,
                      }))
                      deadline = asyncio.get_running_loop().time() + 12
                      while asyncio.get_running_loop().time() < deadline:
                          raw = await asyncio.wait_for(ws.recv(), timeout=12)
                          data = json.loads(raw)
                          if isinstance(data, dict) and data.get("result") is None and data.get("id") == 1:
                              print("BINANCE_WS_SUBSCRIBED", name, data)
                              continue
                          print("BINANCE_WS_OK", name, type(data).__name__, str(data)[:300])
                          return
                      raise asyncio.TimeoutError()
              except Exception as exc:
                  print("BINANCE_WS_ERROR", name, type(exc).__name__, repr(exc))

          async def main():
              for name, url in STREAMS.items():
                  await probe(name, url)
              await probe_subscribe()

          asyncio.run(main())
          PY
          '

      - name: Verify local frontend
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1/ || true)"
            HTTPS_CODE="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve xora.xtinex.com:443:127.0.0.1 https://xora.xtinex.com/ || true)"
            if [[ "$HTTPS_CODE" == "200" || "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
              echo "Frontend reachable (HTTP=${HTTP_CODE:-none}, HTTPS=${HTTPS_CODE:-none})."
              exit 0
            fi
            sleep 5
          done
          echo "Local frontend verification failed. HTTP=${HTTP_CODE:-none} HTTPS=${HTTPS_CODE:-none}" >&2
          exit 1
