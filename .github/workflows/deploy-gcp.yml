name: Deploy to Google Cloud VM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: xora-gcp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Deploy directly on production VM
        if: ${{ !startsWith(github.event.head_commit.message, 'diag:') }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/xora_chart_ai"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the self-hosted runner." >&2
            exit 1
          fi

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            git clone https://github.com/admin-xtinex/xora_chart_ai.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git config core.fileMode false
          git fetch --prune origin main
          git checkout -f main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi

          chmod +x deploy/gcp/deploy.sh deploy/gcp/cleanup-old-data.sh deploy/gcp/install-cleanup-cron.sh
          ./deploy/gcp/deploy.sh
          sudo REPO_DIR="$DEPLOY_DIR" bash deploy/gcp/install-cleanup-cron.sh

      - name: Diagnose Binance Futures WebSocket API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import json
          import websockets

          REQUESTS = [
              ("price-all", "ticker.price", {}),
              ("book-all", "ticker.book", {}),
              ("depth-btc", "depth", {"symbol": "BTCUSDT", "limit": 20}),
              ("klines-btc", "klines", {"symbol": "BTCUSDT", "interval": "1m", "limit": 100}),
              ("ticker24-btc", "ticker.24hr", {"symbol": "BTCUSDT"}),
              ("trades-btc", "trades.recent", {"symbol": "BTCUSDT", "limit": 20}),
          ]

          async def request(ws, req_id, method, params):
              await ws.send(json.dumps({"id": req_id, "method": method, "params": params}))
              raw = await asyncio.wait_for(ws.recv(), timeout=12)
              data = json.loads(raw)
              result = data.get("result")
              if isinstance(result, list):
                  summary = f"list[{len(result)}] first={result[0] if result else None}"
              else:
                  summary = repr(result)
              print("WS_API", method, "status=", data.get("status"), "result=", summary[:700], "error=", data.get("error"))

          async def main():
              url = "wss://ws-fapi.binance.com/ws-fapi/v1"
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=3, ping_interval=None) as ws:
                      print("WS_API_CONNECTED", url)
                      for req_id, method, params in REQUESTS:
                          try:
                              await request(ws, req_id, method, params)
                          except Exception as exc:
                              print("WS_API_REQUEST_ERROR", method, type(exc).__name__, repr(exc))
              except Exception as exc:
                  print("WS_API_ERROR", type(exc).__name__, repr(exc))

          asyncio.run(main())
          PY
          '

      - name: Report current Binance stream availability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import json
          import websockets

          PROBES = {
              "ticker": "wss://fstream.binance.com/ws/btcusdt@ticker",
              "kline": "wss://fstream.binance.com/ws/btcusdt@kline_1m",
              "mark": "wss://fstream.binance.com/ws/btcusdt@markPrice@1s",
              "book": "wss://fstream.binance.com/ws/btcusdt@bookTicker",
              "depth": "wss://fstream.binance.com/ws/btcusdt@depth20@100ms",
          }

          async def probe(name, url):
              try:
                  async with websockets.connect(url, open_timeout=8, close_timeout=2, ping_interval=None) as ws:
                      raw = await asyncio.wait_for(ws.recv(), timeout=8)
                      data = json.loads(raw)
                      print("STREAM_OK", name, "event=", data.get("e"), "bytes=", len(raw))
              except Exception as exc:
                  print("STREAM_ERROR", name, type(exc).__name__, repr(exc))

          async def main():
              await asyncio.gather(*(probe(name, url) for name, url in PROBES.items()))

          asyncio.run(main())
          PY
          '

      - name: Report XORA WebSocket telemetry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker exec xora_chart_api python - <<'PY'
          import asyncio
          import json
          import websockets

          async def main():
              async with websockets.connect("ws://127.0.0.1:8030/ws", open_timeout=5) as ws:
                  await ws.recv()
                  await ws.send(json.dumps({"id": "telemetry", "action": "health", "payload": {}}))
                  msg = json.loads(await ws.recv())
                  print(json.dumps(msg.get("data") or {}, indent=2))

          asyncio.run(main())
          PY

      - name: Verify local frontend
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1/ || true)"
          HTTPS_CODE="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve xora.xtinex.com:443:127.0.0.1 https://xora.xtinex.com/ || true)"
          if [[ "$HTTPS_CODE" == "200" || "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
            echo "Frontend reachable (HTTP=${HTTP_CODE:-none}, HTTPS=${HTTPS_CODE:-none})."
            exit 0
          fi
          echo "Local frontend verification failed. HTTP=${HTTP_CODE:-none} HTTPS=${HTTPS_CODE:-none}" >&2
          exit 1
