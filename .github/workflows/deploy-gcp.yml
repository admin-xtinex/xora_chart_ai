name: Deploy to Google Cloud VM

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: xora-gcp-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 40

    steps:
      - name: Deploy directly on production VM
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/xora_chart_ai"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the self-hosted runner." >&2
            exit 1
          fi

          if [[ ! -d "$DEPLOY_DIR/.git" ]]; then
            git clone https://github.com/admin-xtinex/xora_chart_ai.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"
          git config core.fileMode false
          git fetch --prune origin main
          git checkout -f main
          git reset --hard origin/main

          if [[ ! -f .env.production ]]; then
            cp .env.production.example .env.production
          fi

          chmod +x deploy/gcp/deploy.sh deploy/gcp/cleanup-old-data.sh deploy/gcp/install-cleanup-cron.sh
          ./deploy/gcp/deploy.sh
          sudo REPO_DIR="$DEPLOY_DIR" bash deploy/gcp/install-cleanup-cron.sh

      - name: Diagnose Binance WebSocket
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Backend recent WebSocket logs ==="
          docker logs --since 15m xora_chart_api 2>&1 | grep -Ei 'websocket|WS session|fstream|binance|451|403|timeout|SSL|handshake|ticker' | tail -n 160 || true

          echo "=== Direct VM Binance Futures WebSocket probes ==="
          docker run --rm python:3.12-slim sh -lc '
            pip install -q websockets && python - <<"PY"
          import asyncio
          import json
          import websockets

          STREAMS = {
              "all_tickers_direct": "wss://fstream.binance.com/ws/!ticker@arr",
              "btc_ticker_direct": "wss://fstream.binance.com/ws/btcusdt@ticker",
              "btc_kline_direct": "wss://fstream.binance.com/ws/btcusdt@kline_1m",
              "btc_mark_direct": "wss://fstream.binance.com/ws/btcusdt@markPrice@1s",
              "btc_ticker_combined": "wss://fstream.binance.com/stream?streams=btcusdt@ticker",
          }

          async def probe(name, url):
              try:
                  async with websockets.connect(url, open_timeout=10, close_timeout=3, ping_interval=None) as ws:
                      raw = await asyncio.wait_for(ws.recv(), timeout=10)
                      data = json.loads(raw)
                      print("BINANCE_WS_OK", name, type(data).__name__, str(data)[:300])
              except Exception as exc:
                  print("BINANCE_WS_ERROR", name, type(exc).__name__, repr(exc))

          async def probe_subscribe():
              name = "btc_subscribe_rpc"
              try:
                  async with websockets.connect(
                      "wss://fstream.binance.com/ws",
                      open_timeout=10,
                      close_timeout=3,
                      ping_interval=None,
                  ) as ws:
                      await ws.send(json.dumps({
                          "method": "SUBSCRIBE",
                          "params": ["btcusdt@ticker", "btcusdt@kline_1m", "btcusdt@markPrice@1s"],
                          "id": 1,
                      }))
                      deadline = asyncio.get_running_loop().time() + 12
                      while asyncio.get_running_loop().time() < deadline:
                          raw = await asyncio.wait_for(ws.recv(), timeout=12)
                          data = json.loads(raw)
                          if isinstance(data, dict) and data.get("result") is None and data.get("id") == 1:
                              print("BINANCE_WS_SUBSCRIBED", name, data)
                              continue
                          print("BINANCE_WS_OK", name, type(data).__name__, str(data)[:300])
                          return
                      raise asyncio.TimeoutError()
              except Exception as exc:
                  print("BINANCE_WS_ERROR", name, type(exc).__name__, repr(exc))

          async def main():
              for name, url in STREAMS.items():
                  await probe(name, url)
              await probe_subscribe()

          asyncio.run(main())
          PY
          '

      - name: Probe Always Free regions when current feed is blocked
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          PROJECT="xtinex-trading"
          PROBE_PREFIX="xora-ws-probe"

          cat > /tmp/xora-region-probe.sh <<'SCRIPT'
          #!/bin/bash
          exec > >(tee /dev/ttyS0) 2>&1
          set -u
          export DEBIAN_FRONTEND=noninteractive
          echo "XORA_PROBE_START $(date -Is)"
          apt-get update -qq
          apt-get install -y -qq python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q websockets
          python3 - <<'PY'
          import asyncio
          import json
          import websockets

          STREAMS = {
              "ticker": "wss://fstream.binance.com/ws/btcusdt@ticker",
              "kline": "wss://fstream.binance.com/ws/btcusdt@kline_1m",
              "mark": "wss://fstream.binance.com/ws/btcusdt@markPrice@1s",
          }

          async def probe(name, url):
              try:
                  async with websockets.connect(
                      url,
                      open_timeout=10,
                      close_timeout=3,
                      ping_interval=None,
                  ) as ws:
                      raw = await asyncio.wait_for(ws.recv(), timeout=12)
                      data = json.loads(raw)
                      print("XORA_WS_OK", name, type(data).__name__, str(data)[:180])
                      return True
              except Exception as exc:
                  print("XORA_WS_ERROR", name, type(exc).__name__, repr(exc))
                  return False

          async def main():
              results = await asyncio.gather(*(probe(name, url) for name, url in STREAMS.items()))
              print("XORA_PROBE_VIABLE" if all(results) else "XORA_PROBE_BLOCKED")

          asyncio.run(main())
          PY
          echo "XORA_PROBE_DONE $(date -Is)"
          SCRIPT
          chmod +x /tmp/xora-region-probe.sh

          probe_zone() {
            local zone="$1"
            local suffix="${zone//-/}"
            local name="${PROBE_PREFIX}-${suffix}"
            local output=""

            echo "=== Probe ${zone} ==="
            gcloud compute instances delete "$name" --zone="$zone" --project="$PROJECT" --quiet >/dev/null 2>&1 || true

            if ! gcloud compute instances create "$name" \
              --project="$PROJECT" \
              --zone="$zone" \
              --machine-type=e2-micro \
              --image-family=debian-12 \
              --image-project=debian-cloud \
              --boot-disk-size=10GB \
              --boot-disk-type=pd-standard \
              --network=default \
              --network-tier=STANDARD \
              --no-service-account \
              --no-scopes \
              --metadata=serial-port-enable=TRUE \
              --metadata-from-file=startup-script=/tmp/xora-region-probe.sh \
              --quiet; then
              echo "XORA_REGION_CREATE_ERROR ${zone}"
              return 2
            fi

            for _ in $(seq 1 48); do
              output="$(gcloud compute instances get-serial-port-output "$name" --zone="$zone" --project="$PROJECT" 2>/dev/null || true)"
              if grep -q "XORA_PROBE_DONE" <<<"$output"; then
                break
              fi
              sleep 5
            done

            echo "$output" | grep -E 'XORA_(WS_|PROBE_)' || true
            local rc=1
            if grep -q "XORA_PROBE_VIABLE" <<<"$output"; then
              rc=0
            fi

            gcloud compute instances delete "$name" --zone="$zone" --project="$PROJECT" --quiet || true
            return "$rc"
          }

          SELECTED_ZONE=""
          if probe_zone "us-west1-b"; then
            SELECTED_ZONE="us-west1-b"
          elif probe_zone "us-east1-b"; then
            SELECTED_ZONE="us-east1-b"
          fi

          if [[ -n "$SELECTED_ZONE" ]]; then
            echo "XORA_SELECTED_FREE_TIER_ZONE=$SELECTED_ZONE"
          else
            echo "XORA_NO_VIABLE_FREE_TIER_ZONE"
          fi

      - name: Verify local frontend
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            HTTP_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1/ || true)"
            HTTPS_CODE="$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve xora.xtinex.com:443:127.0.0.1 https://xora.xtinex.com/ || true)"
            if [[ "$HTTPS_CODE" == "200" || "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
              echo "Frontend reachable (HTTP=${HTTP_CODE:-none}, HTTPS=${HTTPS_CODE:-none})."
              exit 0
            fi
            sleep 5
          done
          echo "Local frontend verification failed. HTTP=${HTTP_CODE:-none} HTTPS=${HTTPS_CODE:-none}" >&2
          exit 1
