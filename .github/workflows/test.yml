name: XORA tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "deploy/gcp/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "deploy/gcp/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Compile backend
        run: python -m compileall -q src
      - name: Test backend and architecture invariants
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
