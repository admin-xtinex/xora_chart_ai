name: XORA tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "deploy/gcp/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xora-gcp-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          fi

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src:ro" \
            python:3.12-slim \
            sh -lc "cp -a /src /work && cd /work && python -m pip install --no-cache-dir -e '.[dev]' && python -m compileall -q src && pytest -q"

      - name: Frontend build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/frontend:/src:ro" \
            node:20-alpine \
            sh -lc 'cp -a /src /work && cd /work && if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi && npm run build'
