name: XORA tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "frontend/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "deploy/gcp/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xora-gcp-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            python:3.12-slim \
            sh -lc "python -m pip install --no-cache-dir -e '.[dev]' && python -m compileall -q src && pytest -q"

      - name: Frontend build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/frontend:/app" \
            -w /app \
            node:20-alpine \
            sh -lc "npm ci && npm run build"
