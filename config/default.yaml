cycle:
  interval_seconds: 60
  enabled: true

discovery:
  top_gainers: 5
  top_losers: 5
  top_volume: 5
  trending: 5
  scan_limit: 20
  quote_asset: USDT
  min_quote_volume: 500000

market_data:
  interval: "1m"
  candle_limit: 100
  history_source: binance_futures_rest
  live_source: binance_futures_websocket
  minimum_history_candles: 20
  minimum_ws_candles: 20
  history_concurrency: 5

matcher:
  min_similarity: 55.0
  max_matches_per_symbol: 3

analysis:
  weights:
    volume: 0.35
    order_book: 0.30
    funding: 0.15
    open_interest: 0.00
    volatility: 0.20

decision:
  min_similarity: 55.0
  min_reference_similarity: 55.0
  expected_reference_images: 10
  min_analysis_score: 45.0
  require_all_required: true
  min_risk_reward: 1.5
  rr_targets: [1.5, 2.5, 3.5]

trade:
  mode: demo
  live_enabled: false
  auto_trade: false
  demo_equity: 10000
  risk_percent: 0.5
  default_leverage: 3
  max_leverage: 5
  max_open_positions: 5
  default_rr_targets: [1.5, 2.5, 3.5]
  min_risk_reward: 1.5

ranking:
  top_n: 15
  weights:
    similarity: 0.40
    confidence: 0.25
    risk_reward: 0.15
    analysis: 0.20

reconciliation:
  # Timeframe-based REST reconciliation intervals (in seconds)
  # Historical data is refreshed via REST at these intervals to supplement WebSocket live data
  "1m": 120  # every 2 minutes (within 1-3 minute range)
  "5m": 240  # every 4 minutes (within 3-5 minute range)
  "15m": 420 # every 7 minutes (within 5-10 minute range)
  "1h": 1200 # every 20 minutes (within 10-30 minute range)
  "4h": 1800 # every 30 minutes (within 10-30 minute range)

store:
  max_cycles_kept: 50
  max_opportunities_kept: 200
  max_positions_kept: 200
