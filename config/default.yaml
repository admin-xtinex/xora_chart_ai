cycle:
  interval_seconds: 60
  enabled: true

discovery:
  top_gainers: 5
  top_losers: 5
  top_volume: 5
  trending: 5
  quote_asset: USDT
  min_quote_volume: 500000

market_data:
  interval: "1m"
  candle_limit: 100
  venue: binance_futures

matcher:
  min_similarity: 55.0
  ai_threshold: 70.0
  max_matches_per_symbol: 3

# ── Analysis Engine ──────────────────────────────────────────────────────────
analysis:
  weights:
    volume: 0.30
    order_book: 0.25
    funding: 0.15
    open_interest: 0.10
    volatility: 0.20

# ── Decision Engine ──────────────────────────────────────────────────────────
decision:
  min_similarity: 55.0
  min_analysis_score: 45.0
  require_all_required: true
  min_risk_reward: 1.5
  rr_targets: [1.5, 2.5, 3.5]

# ── Trade Engine ─────────────────────────────────────────────────────────────
trade:
  mode: demo                 # demo | live  (env XORA_TRADE_MODE overrides)
  live_enabled: false        # must be true + mode=live for real orders
  demo_equity: 10000
  risk_percent: 0.5          # % of equity risked per trade
  default_leverage: 3
  max_leverage: 5
  max_open_positions: 5
  default_rr_targets: [1.5, 2.5, 3.5]
  min_risk_reward: 1.5

ranking:
  top_n: 15
  weights:
    similarity: 0.40
    confidence: 0.25
    risk_reward: 0.15
    analysis: 0.20

ai:
  enabled: true
  provider: openai_compatible
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1

store:
  max_cycles_kept: 50
  max_opportunities_kept: 200
  max_positions_kept: 200
