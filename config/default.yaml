cycle:
  interval_seconds: 60
  enabled: true

discovery:
  top_gainers: 5
  top_losers: 5
  top_volume: 5
  trending: 5
  quote_asset: USDT
  min_quote_volume: 500000

market_data:
  interval: "1m"
  candle_limit: 100
  venue: binance_futures

matcher:
  min_similarity: 55.0
  ai_threshold: 70.0
  max_matches_per_symbol: 3

trade:
  default_rr_targets: [1.5, 2.5, 3.5]
  min_risk_reward: 1.5

ranking:
  top_n: 15
  weights:
    similarity: 0.45
    confidence: 0.30
    risk_reward: 0.25

ai:
  # Set enabled: true and provide OPENAI_API_KEY (or XORA_AI_API_KEY) for LLM validation.
  # Without a key, structured rule-based validation is used automatically.
  enabled: true
  provider: openai_compatible
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  # api_key: set via env OPENAI_API_KEY preferred

store:
  max_cycles_kept: 50
  max_opportunities_kept: 200
