services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xora_chart_api
    ports:
      - "8030:8030"
    environment:
      - PORT=8030
      - LOG_LEVEL=INFO
      - XORA_STATE_FILE=/app/state/xora_state.json
      - XORA_WS_STATE_PATH=/app/state/ws_market.json
    volumes:
      - xora_state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8030),5); s.close()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_WS_BASE: ws://localhost:8030/ws
    container_name: xora_chart_ui
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  xora_state:
